name: readme-lies
description: Fail the build when your README or docs reference scripts, files, anchors, or symbols that no longer exist.
branding:
  icon: alert-triangle
  color: red
inputs:
  paths:
    description: Markdown files to check (default: README.md + docs/**/*.md)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - shell: bash
      run: python "$GITHUB_ACTION_PATH/readme_lies.py" --format github ${{ inputs.paths }}
